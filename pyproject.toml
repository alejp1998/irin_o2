[project]
name = "irin-o2"
version = "1.0.0"
description = "IRIN O2 — evolved neural controller for an e-puck (Webots, UPM 2019): GA + NN + Nolfi-Floreano fitness."
readme = "README.md"
requires-python = ">=3.9"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100
include = ["ga_nn.py", "tests/**"]
extend-exclude = ["**/__pycache__/**"]
